# Build the eight images and publish them, tagged by commit SHA.
#
# This job `needs: test`, which is the entire point of splitting it from the build: a failing test now
# means no image exists to deploy. Step 10a's `-DskipTests` (D30) is still in every Dockerfile and is
# still correct there — the gate belongs in the pipeline, where it runs once per commit, rather than in
# eight image builds that would each run the same suite.
#
# WHY GHCR RATHER THAN ECR. Both cost pennies at this size. GitHub Actions authenticates to GHCR with
# the `GITHUB_TOKEN` it already has, so there is no secret to create, store or rotate; ECR needs either
# a long-lived IAM user key in a repository secret or an OIDC role, and the whole argument of
# docs/eks-and-irsa.md is that long-lived keys are the thing worth removing. Swapping to ECR is the
# registry prefix and a `configure-aws-credentials` step.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-finished publish

env:
  REGISTRY: ghcr.io

jobs:
  # The gate. Reusing ci.yml rather than repeating the steps, so there is one definition of "the tests
  # pass" and it cannot drift between the two files.
  test:
    uses: ./.github/workflows/ci.yml

  images:
    name: ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # The only elevated permission in this pipeline, and it is scoped to the job that needs it
      # rather than granted at the top of the file.
      packages: write

    strategy:
      # A matrix, so eight images build in parallel and the log tells you *which* image failed from the
      # job name alone. One job looping over eight `docker build`s takes eight times as long and
      # reports "the build failed".
      matrix:
        service:
          - config-server
          - api-gateway
          - user-service
          - book-service
          - order-service
          - payment-service
          - notification-service
          - analytics-service
      # Publish the seven that work rather than abandoning them because one broke.
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is bookstore-platform/ for every service, because each module's pom
          # inherits from the parent pom. Same as `scripts/build-images.sh`.
          context: 02-bookstore-capstone/bookstore-platform
          file: 02-bookstore-capstone/bookstore-platform/${{ matrix.service }}/Dockerfile
          push: true
          # TWO TAGS, AND ONLY ONE OF THEM IS A VERSION.
          #
          # The SHA tag is immutable: it names exactly one build of exactly one commit forever, which is
          # what makes `kubectl rollout undo` and "which build is in production" answerable. `latest`
          # is a convenience alias that means something different tomorrow and is the one tag you
          # cannot roll back to — Step 10's manifests used it and said so.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/bookstore/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/bookstore/${{ matrix.service }}:latest
          # GitHub's own cache backend. Without it every run re-resolves the whole Maven dependency
          # tree inside the build stage, because the BuildKit cache mount in the Dockerfile is local to
          # a machine and a fresh runner has none. `mode=max` caches intermediate stages too, which
          # here means the build stage rather than only the tiny runtime one.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ===================================================================================================
  # DEPLOY — designed, gated, and deliberately not wired to a cluster in this repository.
  #
  # The assignment allows "an automated deploy, or the deploy stage designed with a manual approval gate
  # before prod". This is the second, and the reason is not effort: reaching the k3s box means either
  # exposing its API server to GitHub's runners or standing up a self-hosted runner inside it, and
  # opening a Kubernetes API server to the internet to make a capstone demo tidier is a bad trade that
  # would sit in this repository as an example.
  #
  # `environment: production` is what makes the gate real rather than a comment: with a required
  # reviewer configured on that environment, the job pauses and GitHub will not run it until a human
  # approves. The secret is scoped to the environment too, so nothing outside an approved deployment can
  # read the kubeconfig at all.
  # ===================================================================================================
  deploy:
    name: deploy to k3s
    needs: images
    # A SELF-HOSTED RUNNER ON THE CLUSTER'S OWN MACHINE, and the choice removes a secret rather than
    # storing one.
    #
    # The alternative was `runs-on: ubuntu-latest` plus a base64 kubeconfig in `secrets.KUBE_CONFIG`.
    # That needs either the k3s API server exposed to GitHub's runners — opening a Kubernetes control
    # plane to the internet to make a demo tidier — or a tunnel. And it puts a long-lived credential
    # with full cluster admin into a repository secret.
    #
    # A runner on the box inverts the direction: it *polls* GitHub over an outbound connection, so no
    # inbound port is opened at all, and it reads the kubeconfig already on the machine. Same argument
    # as GHCR over ECR (D38) and IRSA over an access key: the improvement worth having is the one that
    # deletes the credential, not the one that hides it better.
    runs-on: self-hosted
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Point kubectl at the local cluster
        # k3s writes this on install; `--write-kubeconfig-mode 644` is what makes it readable without
        # sudo. Nothing is copied, decoded or stored — the credential never leaves the machine that
        # already had it.
        run: echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> $GITHUB_ENV

      # `set image` per deployment rather than `apply`, because the manifests in k8s/ are the desired
      # state and the image tag is the only thing a deploy changes. Kubernetes then performs a rolling
      # update on its own: new pod up and passing its readinessProbe before the old one is removed,
      # which is what makes the deploy zero-downtime and is the reason 10c's probes had to be right.
      - name: Roll out the new images
        run: |
          for svc in config-server api-gateway user-service book-service \
                     order-service payment-service notification-service analytics-service; do
            kubectl set image deployment/$svc \
              $svc=${{ env.REGISTRY }}/${{ github.repository_owner }}/bookstore/$svc:${{ github.sha }} \
              -n bookstore
          done

      # THE ROLLBACK PATH, and it is a real one rather than a promise. `kubectl rollout status` fails if
      # the new pods do not become ready inside the timeout, and `rollout undo` returns each Deployment
      # to its previous ReplicaSet — which still exists, and still names the previous SHA tag. That is
      # what the immutable tag buys: rolling back is finding a tag, not rebuilding a commit.
      - name: Wait, and undo if it did not come up
        run: |
          set +e
          failed=0
          for svc in config-server api-gateway user-service book-service \
                     order-service payment-service notification-service analytics-service; do
            kubectl rollout status deployment/$svc -n bookstore --timeout=300s || failed=1
          done
          if [ "$failed" = "1" ]; then
            echo "::error::rollout did not converge - rolling back"
            for svc in config-server api-gateway user-service book-service \
                       order-service payment-service notification-service analytics-service; do
              kubectl rollout undo deployment/$svc -n bookstore || true
            done
            exit 1
          fi

      - name: Smoke test through the gateway
        run: |
          # The one check that proves the platform is serving rather than merely running. A rollout
          # that reports success while every request 500s is the failure a readiness probe cannot see,
          # because the probe asks the process about itself.
          kubectl run smoke-$GITHUB_RUN_ID --rm -i --restart=Never -n bookstore \
            --image=busybox:1.36 --quiet -- \
            wget -qO- --timeout=10 http://api-gateway:8080/api/books > /dev/null
