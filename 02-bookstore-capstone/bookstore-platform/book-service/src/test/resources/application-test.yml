# The profile every test runs under.
#
# No datasource block: Testcontainers supplies one at runtime through @ServiceConnection, and hard-coding
# a URL here is exactly the coupling to a hand-started database that Testcontainers removes.
#
# From Step 6 this file is also why the tests need no config server. Two separate mechanisms, both
# required. The `on-profile: "!test"` guard in the main application.yml stops the *fetch* - config-data
# imports resolve in an early phase, before this file is visible, so disabling the client here could
# not have prevented it. The flag below stops the *check*: spring-cloud-starter-config refuses to start
# a context that has the starter on the classpath and no `spring.config.import`. That check earns its
# keep in production, where what it catches is a service quietly running on bundled defaults.
#
# The consequence is that this file duplicates a few values the config repo also defines. Deliberate:
# the alternative is a test suite that cannot run unless another process is up.
spring:
  cloud:
    config:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    # db/migration only. The dev seed is deliberately absent: a test that depends on demo rows breaks
    # the moment someone edits the seed file, and "which rows exist" should be the test's own decision.
    locations: classpath:db/migration

app:
  aws:
    # Step 9a. The config-move rule from config-repo/README.md - these keys live in the config repo and
    # tests do not read the config server, so without them the context fails to start on an
    # unresolvable placeholder that mentions neither DynamoDB nor configuration.
    #
    # Nested INSIDE the existing `app:` rather than appended as a second one. YAML has no merge for
    # duplicate top-level keys and SnakeYAML refuses the document outright - which at least fails
    # loudly, unlike most of this step's traps.
    region: us-east-1
    s3:
      covers-bucket: covers-test
      presign-ttl: PT5M

    dynamodb:
      browsing-history-table: UserBrowsingHistory-test
      endpoint: ""

  history:
    retention: P30D

  jwt:
    # Test-only, and irrelevant beyond satisfying the length constraint — nothing signed here outlives
    # the test JVM.
    secret: test-only-signing-key-not-used-anywhere-else-0123456789
    expiration-minutes: 60
    issuer: bookstore

logging:
  level:
    org.springframework.web: WARN
    org.hibernate: WARN
