# Shared by EVERY service, in every profile.
#
# Config Server resolves a request for {application}/{profile} into an ordered list of property
# sources. The order is NOT "most specific service file first" - profile beats specificity:
#
#   user-service-dev.yml   >   application-dev.yml   >   user-service.yml   >   application.yml
#
# Read the middle two again. A platform-wide *profile* file outranks a *service-specific* one, so a
# value put in `application-dev.yml` silently overrides the same key in `user-service.yml`, and the
# service file looks ignored. Verified against the running server, not assumed - see
# ConfigServerContractTest, which exists because the intuitive order is the wrong one.
#
# The practical rule that follows: if a service needs to override something, override it at the same
# profile level or lower. `user-service-dev.yml` beats everything.
#
# Nothing is merged by textual inclusion; the client receives all four as separate property sources and
# Spring's normal precedence rules apply.

spring:
  jpa:
    # Off everywhere, deliberately. Open-in-view keeps a database connection held for the whole
    # request so that a lazily-loaded association still works while the JSON is being written - which
    # hides N+1 queries behind the view layer instead of failing where the query belongs.
    open-in-view: false

  cloud:
    openfeign:
      client:
        # Lets the timeouts below change in a running process. Read the property's own description
        # carefully - "enables options value refresh capability" - because it is narrower than it
        # sounds: it refreshes Feign's Request.Options, and NOT the client's URL.
        #
        # Tested rather than assumed. `app.book-service.url` was pointed at a dead port, refresh was
        # POSTed to order-service, and the endpoint duly reported `app.book-service.url` as changed -
        # after which order-service kept placing orders successfully against the old address. A
        # @FeignClient url is resolved into the target when the client is built, and this flag does not
        # move it.
        #
        # Which is the general lesson of 6c in one line: **/actuator/refresh always updates the
        # Environment, and updating the Environment changes nothing by itself.** Something has to be
        # able to read the value again.
        refresh-enabled: true
        config:
          default:
            # A BUG THIS STEP FOUND. These lived in order-service's and payment-service's
            # `application-dev.yml`, and in neither `application-prod.yml`. Production was therefore
            # running on Feign's defaults, which are effectively "wait forever" - the exact failure
            # mode Step 5b added them to prevent, disabled in the only environment where it matters.
            #
            # Nothing caught it for two sub-steps because no one file showed both profiles side by
            # side. Pulling four services' configuration into one directory is what made it visible,
            # which is a better argument for a config server than "less duplication".
            #
            # They belong here, unqualified by profile: how long a caller is willing to be blocked is a
            # promise about this platform, not a property of a developer's laptop.
            connect-timeout: 2000    # ms to establish a TCP connection
            read-timeout: 3000       # ms to wait for a response once connected
            logger-level: basic

  servlet:
    multipart:
      # Boot's defaults are 1MB per file and 10MB per request, which rejects most real cover images
      # with a 500 that mentions neither the limit nor the file. Raised, and still bounded: an
      # unbounded upload endpoint is a way to fill a disk from the internet.
      #
      # Platform-wide rather than book-service-only because a limit that differs between the gateway
      # and the service behind it fails in the worse direction - the bytes are accepted at the edge,
      # travel the network, and are then rejected.
      max-file-size: 5MB
      max-request-size: 6MB

  kafka:
    # Platform-wide, for the same reason the JWT signing key is: a producer and its consumers have to
    # agree on the broker and on the topic name, or nothing works and nothing says why. A consumer
    # subscribed to a topic that no one publishes to is simply silent.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      # `acks: all` - the leader answers only once every in-sync replica has the record. The default
      # (`acks: 1`) means the leader alone has it, so a leader failing before replication loses an
      # acknowledged write. Locally there is one broker and this changes nothing; it is here so the
      # setting is a decision rather than an omission when Step 10 runs three.
      acks: all

      # Retries plus idempotence. Retrying alone is how one network hiccup becomes two copies of the
      # same event: the broker wrote the record and the acknowledgement was lost, so the producer
      # sends it again. `enable.idempotence` gives each producer a sequence number the broker
      # deduplicates against, which makes a retry safe *within one producer session*.
      #
      # It is not exactly-once. A process that dies after committing an order and before publishing
      # sends nothing at all, and a restarted producer is a new session. Consumers still have to be
      # idempotent (Step 7c) - this only removes the duplicates the producer itself would create.
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

        # No `__TypeId__` header. JsonSerializer writes the producer's fully-qualified class name into
        # one by default, and a JsonDeserializer downstream obeys it - so order-service would be
        # instructing notification-service to instantiate `com.example.order.event.OrderPlaced`, a class
        # that does not exist there and must not (D12). Consumers decide how to read the bytes; a
        # producer publishes facts, not Java types.
        spring.json.add.type.headers: false

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Deliberately StringDeserializer, not JsonDeserializer. The JSON is turned into an object by a
      # message converter, driven by the @KafkaListener method's own parameter type - see
      # KafkaConsumerConfig. That is what lets one service consume two topics carrying two event types.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # A new consumer group reads the topic from the beginning rather than from "now". `latest` is the
      # default and it silently loses every event published before a consumer first started - which
      # during development is every event, and in production is every event during a deployment gap.
      auto-offset-reset: earliest

      # Offsets are committed by the container after the listener returns, not on a timer by the client.
      # Auto-commit acknowledges messages that have been *fetched*, so a crash mid-processing skips
      # them: at-most-once, silently. This makes delivery at-least-once instead, which is a redelivery
      # problem (solvable, Step 7c) rather than a data-loss problem (not solvable).
      enable-auto-commit: false

    listener:
      ack-mode: RECORD

server:
  error:
    # A stack trace in an error response tells an attacker the framework, the version and the package
    # layout. It belongs in the log, where it already is.
    include-stacktrace: never

app:
  kafka:
    topics:
      # Named after the fact, not after the service that happens to publish it today: `order.placed`
      # rather than `order-service-events`. A topic outlives the code that writes to it.
      order-placed: bookstore.order.placed
      payment-completed: bookstore.payment.completed

  jwt:
    # These two were identical in four services because they describe the *token format*, and every
    # service on the platform has to agree on it or nothing verifies. That is the definition of
    # platform-wide configuration, and it took a config server to have somewhere to put it.
    expiration-minutes: 60
    issuer: bookstore

management:
  endpoints:
    web:
      exposure:
        # `refresh` is what makes Step 6c possible - a POST to it re-fetches from this server and
        # rebinds the beans that can be rebound. `env` is how you prove it worked.
        #
        # Both are internal endpoints. Actuator redacts values whose key looks like a credential
        # (`app.jwt.secret` matches), but /actuator/env still discloses the full shape of the
        # configuration, and /actuator/refresh is a POST that changes a running process. Step 8's
        # gateway routes no /actuator/** from outside; until then these are localhost-only in practice.
        include: health,info,refresh,env,loggers,metrics,prometheus
  endpoint:
    health:
      show-details: always
      # Splits /actuator/health into two more useful questions, and 10c's probes depend on the
      # distinction absolutely:
      #
      #   /actuator/health/liveness    is this process broken beyond recovery?   -> restart it
      #   /actuator/health/readiness   can it serve traffic right now?           -> route to it
      #
      # Pointing a Kubernetes livenessProbe at plain /actuator/health is the classic mistake, and it
      # is worth being able to say why: that endpoint aggregates the datasource, so a database outage
      # makes every replica "unhealthy" and Kubernetes restarts all of them - repeatedly, for a problem
      # no restart can fix, while the pods that would have recovered lose their connection pools. The
      # liveness group deliberately contains only the application's own state.
      #
      # Spring Boot turns these on by itself when it detects Kubernetes (the KUBERNETES_SERVICE_HOST
      # environment variable). It is set explicitly anyway: auto-detection makes the endpoints exist in
      # one environment and 404 in another, and a readinessProbe against a 404 is a pod that never
      # becomes Ready, with nothing in the log to say so.
      probes:
        enabled: true

  metrics:
    tags:
      # Every metric this process publishes gets `application=<name>`. Prometheus adds its own labels
      # for pod and namespace, but not this: without it, `http_server_requests_seconds_count` from
      # eight services is one undifferentiated series and "which service is erroring" cannot be asked.
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        # WHAT MAKES p99 POSSIBLE AT ALL, and the distinction is worth being precise about because the
        # obvious-looking alternative is wrong.
        #
        # `percentiles:` would have each process compute its own 99th percentile and publish the answer.
        # Those numbers CANNOT BE AGGREGATED: the p99 of three replicas is not the mean, the max, or any
        # function of their three p99s. With an autoscaler adding and removing replicas, a
        # per-instance percentile is a number about one pod that nobody wants.
        #
        # `percentiles-histogram: true` publishes cumulative BUCKET COUNTS instead. Counts add up across
        # replicas, so Prometheus computes a true platform-wide p99 with `histogram_quantile` after
        # summing them. The cost is series count - a bucketed timer is dozens of series rather than one -
        # which is exactly why it is enabled for HTTP requests and nothing else.
        http.server.requests: true
      slo:
        # Explicit bucket boundaries, chosen from what this platform actually does rather than left to
        # Micrometer's defaults: a catalog read is tens of milliseconds (Step 9 measured 24 ms), and
        # placing an order crosses two services with a 3 s Feign read timeout behind it, so the top
        # bucket has to sit above that or every timeout lands in `+Inf` and the quantile is a guess.
        http.server.requests: 50ms,100ms,250ms,500ms,1s,3s,5s

resilience4j:
  # Aspect ordering is platform policy, so it is stated once. The per-instance thresholds are not -
  # those live with the service that owns the dependency being guarded.
  #
  # Resilience4j nests Retry OUTSIDE CircuitBreaker by default. Two things go wrong with that: one
  # retried call records three separate failures against the breaker, and - worse - when the breaker is
  # open its refusal travels out to Retry, which retries being told no through the full backoff.
  # "Fail fast" measured 619 ms.
  #
  # Spring's Ordered convention is that a LOWER number runs first, and therefore sits further OUT.
  # (Guessing it the other way round produced a build that looked configured and behaved exactly as
  # before - the failing test was the only thing that noticed.)
  #
  # CircuitBreaker 1, Retry 2 gives CircuitBreaker(Retry(call)): three attempts count as one failure,
  # and an open circuit refuses in microseconds with no retry in the path.
  #
  # Inert in user-service and book-service, which have no Resilience4j on the classpath. An unused
  # property costs nothing; a platform rule discovered independently by each service costs a lot.
  circuitbreaker:
    circuit-breaker-aspect-order: 1
  retry:
    retry-aspect-order: 2
