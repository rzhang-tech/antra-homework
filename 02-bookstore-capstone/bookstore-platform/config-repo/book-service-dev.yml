# book-service, local development. Owns `bookdb` and has credentials for no other.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/bookdb}
    username: bookdb
    password: bookdb
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  aws:
    s3:
      # Account-specific, because S3 bucket names are globally unique across every AWS account on
      # earth - so unlike a DynamoDB table name this cannot be a constant in the shared file. Printed
      # by scripts/aws/s3-covers-bucket.sh.
      covers-bucket: bookstore-covers-018733
