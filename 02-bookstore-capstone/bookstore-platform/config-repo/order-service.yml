# order-service, all profiles.

server:
  port: 8083

app:
  saga:
    # How long an order may sit in PENDING before recovery presumes its orchestrator died. Comfortably
    # longer than the worst honest case (every Feign timeout plus retries, several times over):
    # unwinding an order that was merely slow is a self-inflicted outage, and being slow to reclaim
    # stock is not.
    pending-timeout: PT2M
    recovery-interval-ms: 30000

resilience4j:
  # The aspect *ordering* is platform policy and lives in the shared application.yml. The thresholds
  # below are this service's own: they describe how much failure the catalog call is allowed to show
  # before order-service stops making it, which is a judgement about this dependency and no other.
  circuitbreaker:
    instances:
      catalog:
        # Decide on the last 10 calls rather than on a time window: a low-traffic service would
        # otherwise take minutes to accumulate enough evidence to react.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10

        # Never open on the first failure. Two failures out of two is 100% and means almost nothing;
        # this waits for five calls before the rate is allowed to trip anything.
        minimum-number-of-calls: 5

        # Half the calls failing is not a blip - it is an outage. Lower would flap on ordinary noise.
        failure-rate-threshold: 50

        # How long to stay open before testing the water again. Long enough for a pod to restart,
        # short enough that recovery is not noticeably delayed.
        wait-duration-in-open-state: 10s

        # HALF_OPEN lets exactly three probes through. If they pass the circuit closes; if they fail it
        # opens again for another 10s. This is what stops a recovering service being flattened by the
        # full backlog the instant it answers one request.
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

        # A slow call is a failure even when it eventually succeeds - waiting 3s for a book is an
        # outage from the customer's point of view, and holds a thread the whole time.
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50

        # THE IMPORTANT ONE. These are book-service answering correctly, not failing:
        # "no such book" (404) and "not enough stock" (409) are valid outcomes of a valid request.
        # Counting them would open the circuit under entirely healthy traffic - customers asking for
        # books that do not exist would take the catalog "down".
        #
        # Note these are fully-qualified class names of *this service's* exceptions. They are the
        # reason resilience thresholds cannot be shared across services even where the numbers match:
        # com.example.order.* does not exist in payment-service, and a config server will hand over a
        # wrong class name just as happily as a right one.
        ignore-exceptions:
          - com.example.order.exception.ResourceNotFoundException
          - com.example.order.exception.OrderNotAllowedException

        register-health-indicator: true

  retry:
    instances:
      catalog:
        # Three attempts total, not three retries. Beyond that a "transient" failure is not transient,
        # and retrying harder is how a struggling service gets finished off.
        max-attempts: 3

        # Backoff, not a tight loop: 200ms, then 400ms. Without the multiplier, every caller retries in
        # lockstep and delivers a second thundering herd exactly when the service is weakest.
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

        # Same exclusions. Retrying a 404 three times produces the same 404 three times, slower.
        ignore-exceptions:
          - com.example.order.exception.ResourceNotFoundException
          - com.example.order.exception.OrderNotAllowedException

management:
  endpoints:
    web:
      exposure:
        # Extends the shared list with the breaker endpoints. Circuit state has to be observable: a
        # breaker whose state nobody can see turns an outage into a mystery, and "it started working
        # again on its own" is not an incident report.
        include: health,info,refresh,env,metrics,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
