# payment-service, all profiles.

server:
  port: 8084

app:
  saga:
    recovery-interval-ms: 30000

resilience4j:
  # Same thresholds as order-service's `catalog` breaker, and deliberately still written out here.
  #
  # Two services agreeing on a number today is not the same as the number being one decision. The
  # signing key in the shared file IS one decision - user-service signs with it and the others verify
  # with it, so they must agree or nothing works. These thresholds merely happen to match: order-service
  # tolerating catalog failures and payment-service tolerating order failures are separate judgements
  # about separate dependencies, and merging them would mean tuning one breaker silently retunes the
  # other. Centralised configuration makes coincidental duplication easy to mistake for shared meaning.
  circuitbreaker:
    instances:
      orders:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # Business answers, not failures - counting them would open the circuit under healthy traffic.
        ignore-exceptions:
          - com.example.payment.exception.ResourceNotFoundException
          - com.example.payment.exception.PaymentNotAllowedException
  retry:
    instances:
      orders:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.example.payment.exception.ResourceNotFoundException
          - com.example.payment.exception.PaymentNotAllowedException

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env,metrics,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
