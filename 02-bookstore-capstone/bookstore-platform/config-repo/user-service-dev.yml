# user-service, local development.
#
# This service owns database `userdb` and has credentials for no other. Centralising configuration does
# not soften the Database-per-Service boundary: the config server holds four *separate* datasource
# blocks, and no service is ever sent another service's credentials. It only ever answers for the
# application name that asked.

spring:
  datasource:
    # Overridable, with the laptop's address as the default - the same idiom the four `*-prod.yml`
    # files have used since Step 6d, minus the requirement to set it. Step 10b needed it because a
    # container reaching `localhost:5433` reaches itself; compose supplies
    # DB_URL=jdbc:postgresql://user-db:5432/userdb and 10c supplies it from a ConfigMap.
    #
    # Only the host and port vary. The credentials do not, because they are this database's
    # credentials wherever it runs, and a service that could be handed a different username is a
    # service that could be pointed at another service's database.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/userdb}
    username: userdb
    password: userdb
  flyway:
    locations: classpath:db/migration,classpath:db/seed
