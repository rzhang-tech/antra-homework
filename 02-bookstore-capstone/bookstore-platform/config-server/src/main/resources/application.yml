spring:
  application:
    name: config-server

  # NATIVE, not git, for local development - and this is a real trade-off, not a shortcut.
  #
  #   native  reads the working directory. Edit a file, restart or refresh, done. No history: the
  #           audit trail is whatever the surrounding Git repository happens to record.
  #   git     clones a repository and serves committed content only. Every change is a commit with an
  #           author and a timestamp, and a bad value can be reverted like any other line of code.
  #
  # The git backend is the one that satisfies "one place to change AND audit configuration", so it is
  # what production uses - see the `git` profile below. Locally it means an uncommitted edit is simply
  # not served, which turns a two-second experiment into a commit, and Step 6c involves a lot of
  # experimenting. Both are configured; the default is the one that suits the phase of work.
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          # Relative to the working directory, which the documented run command
          # (`cd config-server && ../mvnw spring-boot:run`) makes `bookstore-platform/config-server`.
          # Override CONFIG_REPO when running the jar from anywhere else.
          search-locations: ${CONFIG_REPO:file:../config-repo}

      # Encryption (Step 6d). The key itself comes from the ENCRYPT_KEY environment variable and is
      # deliberately absent from this file - a master key committed next to the values it protects
      # protects nothing.
      #
      #   ENCRYPT_KEY=... ../mvnw spring-boot:run
      #   curl -X POST localhost:8888/encrypt -H 'Content-Type: text/plain' --data-binary 'the secret'
      #   -> paste the result into the repo as  secret: '{cipher}<result>'
      #
      # The server decrypts before serving, so no client needs the key or any extra dependency. That
      # is also the limit of what this buys: it keeps credentials out of a Git history that everyone
      # with read access can browse forever, and it hands the plaintext to anything that can reach
      # this server. Production uses `${ENV_VAR}` placeholders instead, which the server passes
      # through unresolved - see config-repo/application-prod.yml.
      #
      # Start without ENCRYPT_KEY and the failure is loud in the right place, which was worth
      # checking rather than assuming:
      #
      #   config server  WARN  Cannot decrypt key: app.jwt.secret
      #                        serves it renamed to `invalid.app.jwt.secret`
      #   client         APPLICATION FAILED TO START
      #                        Property: app.jwt.secret  Reason: app.jwt.secret must be set
      #
      # /encrypt and /decrypt are unauthenticated, because this server has no security at all. On a
      # laptop that is fine and in a real deployment it is not: anything that can reach /decrypt can
      # turn any ciphertext back into a credential. The config server belongs on an internal network
      # behind Step 8's gateway, and /decrypt is worth disabling outright once nothing needs it.

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        # /actuator/health is what Step 10's readiness probe will call, and what tells you the
        # difference between "the config server is down" and "the config server has no such file".
        include: health,env
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example: DEBUG

---
# Production: serve committed configuration only.
#
# `file:` here because the config repo currently lives inside this project's own Git repository. In a
# real deployment the URI is an https:// remote with a deploy key, and the config lives in a repository
# separate from the code - a config change should not require a code review from the service team, and
# a code change should not be able to alter production configuration silently.
spring:
  config:
    activate:
      on-profile: git
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:file:../../..}
          search-paths: 02-bookstore-capstone/bookstore-platform/config-repo
          default-label: main
          # Re-clone on every request rather than serving a stale working copy. Slower, and correct:
          # a config server that hands out yesterday's values is worse than one that is simply down,
          # because nothing looks wrong.
          force-pull: true
          clone-on-start: true
