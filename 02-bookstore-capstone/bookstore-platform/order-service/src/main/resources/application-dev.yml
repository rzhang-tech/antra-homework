spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/orderdb
    username: orderdb
    password: orderdb
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          default:
            # Explicit timeouts, because the defaults are effectively "wait forever". An unbounded
            # call is how one slow service exhausts every caller's threads and takes the platform
            # down with it — the failure mode Resilience4j addresses properly in 5c.
            connect-timeout: 2000    # ms to establish a TCP connection
            read-timeout: 3000       # ms to wait for a response once connected
            logger-level: basic
      # book-service's own SLA has to be met inside these numbers; they are a promise about how long
      # order-service is willing to be blocked, not a guess at how fast the catalog is.

app:
  book-service:
    url: http://localhost:8082
  jwt:
    secret: w4HvWMieqVUX1LJpx/wVR+yANNMPgD/dwfEySBsQuZyr7nej+tEV7aZkrzB12Ip3

logging:
  level:
    com.example: DEBUG
    # Logs each outgoing Feign call and its status — the first thing to look at when a cross-service
    # call misbehaves.
    com.example.order.client.BookClient: DEBUG
