spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration

app:
  book-service:
    # A hostname, not an address: Step 10 makes this a Kubernetes service name.
    url: ${BOOK_SERVICE_URL}
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.example: INFO
