spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration

app:
  order-service:
    url: ${ORDER_SERVICE_URL}
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.example: INFO
