# Local development. This service owns database `userdb` and has credentials for no other — the
# Database-per-Service boundary is a real one, not a convention.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/userdb
    username: userdb
    password: userdb
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    # DEV ONLY, and shared by every service on purpose: user-service signs with it, the others verify
    # with it. In Step 6 it comes from the config server, and in Step 10 from a Kubernetes Secret.
    secret: w4HvWMieqVUX1LJpx/wVR+yANNMPgD/dwfEySBsQuZyr7nej+tEV7aZkrzB12Ip3

logging:
  level:
    com.example: DEBUG
