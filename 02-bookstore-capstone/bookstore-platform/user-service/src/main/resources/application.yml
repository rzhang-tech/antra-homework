# What is left of this service's configuration after Step 6.
#
# `application-dev.yml` and `application-prod.yml` are gone - the datasource, the port, the signing key,
# the log levels and the Flyway locations all live in the config repo now. What could not move is the
# bootstrap paradox: a service cannot fetch its configuration until it knows its own name and the
# address of the server holding it. Those two facts, and nothing else, ship inside the jar.

spring:
  application:
    # The `{application}` in the config server's `/{application}/{profile}` lookup. Change it and this
    # service silently receives only `application.yml` - the shared defaults, with no datasource - and
    # fails on the first query rather than at startup. Worth knowing before it happens at 3am.
    name: user-service
  profiles:
    default: dev
  cloud:
    config:
      # These sit in the NON-profile document because they are not profile-specific: how this service
      # behaves when the config server is missing is the same question in dev and in prod.
      #
      # Read the timestamps in the startup log and it looks like the backoff below does nothing - six
      # attempts appear within two milliseconds of each other. They are not. Config data is loaded
      # before the logging system exists, so these messages go through a DeferredLog and are replayed
      # in a burst once logging starts; every one of them carries the *replay* time. The wall clock is
      # the only honest measurement here, and it says the backoff is real:
      #
      #   max-attempts 1, server unreachable    4.5 s
      #   max-attempts 6, server unreachable   31.2 s     <- 26.7 s of it spent backing off
      #
      # (Two resources are fetched, `/user-service/dev` and `/user-service/default`, so the ladder
      # 1000+1500+2250+3375+5062 ms is paid twice.)

      # Refuse to start rather than start wrong.
      #
      # The tempting alternative is to fall back to bundled defaults when the config server is
      # unreachable. That is how a service comes up holding last release's signing key and rejects
      # every token on the platform while reporting itself healthy. A process that will not start is a
      # visible, obviously-attributable failure; a process running on stale configuration is not.
      fail-fast: true
      retry:
        # Fail-fast is not fail-instantly. On a cold start everything comes up at once and the config
        # server may be seconds behind - a race Step 10's orchestration makes routine.
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 8000

---
# Everything below is skipped when the `test` profile is active.
#
# A test that reaches out to a config server is not testing this service - it fails whenever a server on
# somebody's laptop is down, and it means the suite cannot run in CI without standing up an extra
# process. Tests configure themselves from `application-test.yml`, which is the one place that is
# *allowed* to duplicate a value.
spring:
  config:
    activate:
      on-profile: "!test"
    # NOT `optional:`. Marking the import optional would let this service start with no datasource, no
    # port and no signing key, then fail somewhere far away from the cause. See fail-fast above.
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
