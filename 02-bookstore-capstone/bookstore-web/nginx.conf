# nginx serves the built Angular bundle and proxies /api to the gateway.
#
# THE PROXY IS THE WHOLE DESIGN DECISION, and it is worth being clear about what it buys, because the
# obvious alternative looks simpler and is worse.
#
# The obvious version is to build the app with the API's address compiled in —
# `apiUrl: 'http://54.198.32.208:30080'` in an environment file. That produces an image that only works
# against one server. Rebuild for staging, rebuild for a new EC2 address, and the image tag stops
# meaning "this commit" and starts meaning "this commit, for that host". Step 11 spent its time making
# a tag mean one build forever; baking a hostname into the bundle undoes it.
#
# So the app calls `/api/...` relative, and this file decides what that means at RUN time. The image is
# the same everywhere; only the Service name it proxies to is deployment configuration, and inside the
# cluster that name is stable.
#
# It also removes CORS from the deployed path entirely: the browser sees one origin, so there is no
# cross-origin request to preflight.
#
# And `ng serve` is the same shape — `proxy.conf.json` makes the dev server forward /api, so the
# browser talks only to localhost:4200 and that path is same-origin too. **So neither path exercises
# CORS**, which is worth saying plainly rather than implying otherwise: `http://localhost:4200` is in
# the gateway's allowed-origins for the case where somebody points the app straight at the API instead,
# and the check itself is visible with curl:
#
#   curl -i -X OPTIONS <api>/api/orders -H 'Origin: http://localhost:4200' \
#        -H 'Access-Control-Request-Method: POST'      -> 200 + Access-Control-Allow-Origin
#   ...with Origin: http://localhost:9999               -> 403
#   ...with no Origin at all                            -> 200, because CORS is a browser mechanism
#
# A proxy is the normal answer for a real deployment precisely because it makes the question moot.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An Angular app has client-side routes the server knows nothing about. Without this, refreshing on
    # any path but `/` returns nginx's 404 rather than the app — the classic single-page-app deployment
    # bug, and the one that only shows up after someone bookmarks a page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # The in-cluster Service name. Resolved by Kubernetes DNS, so it survives the gateway being
        # rescheduled, restarted or scaled — which an IP address would not.
        proxy_pass http://api-gateway:8080;

        # STRIP Origin, AND THIS ONE LINE COST A DEBUGGING SESSION.
        #
        # The claim above — "a proxy removes CORS from the deployed path" — is only half true, and the
        # half that is wrong fails in a way that looks like a permissions bug. **A browser sends
        # `Origin` on same-origin POST requests too**; it omits it only for same-origin GETs. So
        # nginx forwarded `Origin: http://<node-ip>:30081`, the gateway found it absent from
        # allowed-origins, and Spring rejected the ACTUAL request with 403 — not just a preflight,
        # which Step 8c already documented and which is exactly what made this confusing:
        #
        #   GET  /api/books          200      <- no Origin sent, so no check ran
        #   POST /api/auth/register  403      <- Origin sent, and it is not on the list
        #
        # Adding the node's address to allowed-origins would also fix it, and would bake a deployment's
        # IP into platform configuration - wrong the moment the instance is replaced.
        #
        # Clearing the header is right rather than merely convenient: from the browser's point of view
        # this request *is* same-origin, and the same-origin policy has already done the protecting.
        # The CORS check downstream is answering a question nobody asked.
        proxy_set_header Origin "";

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Authorization must survive the hop or every authenticated request fails with a 401 that looks
        # like a login problem. nginx forwards unknown headers by default; this is here because the
        # failure it prevents is expensive to diagnose.
        proxy_pass_request_headers on;

        # Longer than the gateway's own 10s response timeout, so a slow backend surfaces as the
        # gateway's 504 rather than as nginx's — one timeout answering for the platform, not two.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Hashed filenames are content-addressed, so they can be cached forever. index.html must not be,
    # or a browser keeps loading an old bundle that references JavaScript no longer on the server.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # For the readiness probe. A probe against `/` would work and would also render the whole app on
    # every check; this returns 12 bytes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
