# Local development against the Dockerized PostgreSQL in ../../docker-compose.yml.
# Start it first:  docker compose up -d   (from 02-bookstore-capstone/)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bookstore
    username: bookstore
    password: bookstore
  jpa:
    hibernate:
      # Flyway owns the schema now. Hibernate may only check that the entity matches the tables —
      # if they drift, the app refuses to start instead of silently altering the database.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # db/migration = the real schema (runs in every environment)
    # db/seed      = demo rows, dev only — this line is the only thing that loads them
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    com.example.bookstore: DEBUG            # makes the LoggingAspect's argument logging visible
    org.hibernate.orm.jdbc.bind: TRACE      # show the values bound into prepared statements
