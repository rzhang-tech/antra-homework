# Production-shaped profile. Everything sensitive comes from the environment — no credential is ever
# committed. Step 6 moves these values to the Config Server; Step 10 to Kubernetes ConfigMap/Secret.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # never let Hibernate mutate a production schema; Flyway owns the DDL
    show-sql: false
  flyway:
    # Default location only (classpath:db/migration) — db/seed is deliberately absent, so the demo
    # books cannot reach production.
    locations: classpath:db/migration

logging:
  level:
    com.example.bookstore: INFO
