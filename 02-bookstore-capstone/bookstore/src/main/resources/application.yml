spring:
  application:
    name: bookstore
  profiles:
    # Overridable at runtime: --spring.profiles.active=prod, or SPRING_PROFILES_ACTIVE=prod
    default: dev
  jpa:
    open-in-view: false   # fail loudly on lazy loading outside a transaction instead of hiding N+1s

server:
  port: 8080
  error:
    include-stacktrace: never   # never leak internals; GlobalExceptionHandler owns the error body

app:
  jwt:
    # How long a token stays valid. Short enough that a stolen token expires soon, long enough that a
    # user is not re-authenticating constantly. A refresh-token flow is the usual way to have both;
    # it is out of scope here.
    expiration-minutes: 60
    issuer: bookstore
