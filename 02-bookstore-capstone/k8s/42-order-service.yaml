# order-service — places orders; the saga that unwinds.
#
# The probe block, the resource block and the config wiring are the same shape in all seven service
# manifests; 40-user-service.yaml carries the reasoning for each and is the one to read first.
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: bookstore
  labels: {app: order-service}
spec:
  selector: {app: order-service}
  ports:
    - port: 8083
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: bookstore
  labels: {app: order-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      containers:
        - name: order-service
          image: bookstore/order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: bookstore-endpoints
                  key: CONFIG_SERVER_URL
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: bookstore-endpoints
                  key: ORDER_DB_URL
            - name: BOOK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bookstore-endpoints
                  key: BOOK_SERVICE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: bookstore-endpoints
                  key: KAFKA_BOOTSTRAP_SERVERS
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 384Mi
              cpu: 50m
            limits:
              memory: 640Mi
