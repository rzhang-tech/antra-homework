# notification-service — an event consumer with no API.
#
# The probe block, the resource block and the config wiring are the same shape in all seven service
# manifests; 40-user-service.yaml carries the reasoning for each and is the one to read first.
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: bookstore
  labels: {app: notification-service}
spec:
  selector: {app: notification-service}
  ports:
    - port: 8085
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: bookstore
  labels: {app: notification-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service}
      annotations:
        # Same checksum config-server carries, and for the same reason: EVERY service reads the config
        # repo once at startup and never again. Stamping it only on config-server was a real gap —
        # a changed value reached the server and none of its seven clients. deploy.sh replaces it.
        bookstore.config-repo/checksum: "replaced-by-deploy.sh"
    spec:
      containers:
        - name: notification-service
          image: bookstore/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: bookstore-endpoints
                  key: CONFIG_SERVER_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: bookstore-endpoints
                  key: KAFKA_BOOTSTRAP_SERVERS
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 224Mi
              cpu: 50m
            limits:
              memory: 384Mi
